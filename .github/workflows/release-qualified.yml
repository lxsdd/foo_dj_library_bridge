name: Release qualified foobar bridge candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful foobar bridge candidate workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate run and locate exact artifact
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"

          [[ "$conclusion" == "success" ]] || { echo "Candidate run is not successful." >&2; exit 1; }
          [[ "$event" == "workflow_dispatch" ]] || { echo "Candidate run was not manually dispatched." >&2; exit 1; }
          [[ "$head_branch" == "main" ]] || { echo "Candidate run must target main; got $head_branch." >&2; exit 1; }
          [[ "$workflow_path" == ".github/workflows/candidate.yml" ]] || { echo "Unexpected candidate workflow: $workflow_path" >&2; exit 1; }

          expected_artifact="foo_dj_library_bridge-component-$head_sha"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
          mapfile -t matches < <(jq -r --arg name "$expected_artifact" '.artifacts[] | select(.expired == false) | select(.name == $name) | [.id,.name] | @tsv' <<<"$artifacts_json")
          [[ ${#matches[@]} -eq 1 ]] || { echo "Expected exactly one artifact named $expected_artifact, found ${#matches[@]}." >&2; exit 1; }
          IFS=$'\t' read -r artifact_id artifact_name <<<"${matches[0]}"

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download exact component candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify component, architecture proof, version, and commit binding
        id: manifest
        shell: bash
        env:
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
        run: |
          set -euo pipefail
          cd candidate
          test -f BUILD-MANIFEST.txt
          test -f SHA256SUMS.txt

          mapfile -t components < <(find . -maxdepth 1 -type f -name '*.fb2k-component' -printf '%f\n')
          [[ ${#components[@]} -eq 1 ]] || { echo "Expected exactly one .fb2k-component file." >&2; exit 1; }
          component="${components[0]}"

          manifest_commit="$(sed -n 's/^commit=//p' BUILD-MANIFEST.txt | tr -d '\r')"
          version="$(sed -n 's/^version=//p' BUILD-MANIFEST.txt | tr -d '\r')"
          status="$(sed -n 's/^status=//p' BUILD-MANIFEST.txt | tr -d '\r')"
          root_machine="$(sed -n 's/^root_dll_machine=//p' BUILD-MANIFEST.txt | tr -d '\r')"
          x64_machine="$(sed -n 's/^x64_dll_machine=//p' BUILD-MANIFEST.txt | tr -d '\r')"

          [[ "$manifest_commit" == "$HEAD_SHA" ]] || { echo "Manifest commit mismatch." >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid VERSION in manifest: $version" >&2; exit 1; }
          [[ "$status" == "PASS" ]] || { echo "Candidate manifest is not PASS." >&2; exit 1; }
          [[ "$root_machine" == "0x014C" ]] || { echo "Root DLL is not x86." >&2; exit 1; }
          [[ "$x64_machine" == "0x8664" ]] || { echo "x64 DLL is not AMD64." >&2; exit 1; }
          [[ "$component" == "foo_dj_library_bridge-$version.fb2k-component" ]] || { echo "Component filename/version mismatch." >&2; exit 1; }

          sha256sum --check SHA256SUMS.txt
          unzip -l "$component" > component-list.txt
          grep -Eq '[[:space:]]foo_dj_library_bridge\.dll$' component-list.txt
          grep -Eq '[[:space:]]x64/foo_dj_library_bridge\.dll$' component-list.txt
          if grep -Eq '[[:space:]]x86/' component-list.txt; then
            echo "Invalid x86/ directory found in foobar2000 component." >&2
            exit 1
          fi

          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish exact qualified candidate without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.manifest.outputs.tag }}
          VERSION: ${{ steps.manifest.outputs.version }}
          COMPONENT: ${{ steps.manifest.outputs.component }}
          HEAD_SHA: ${{ steps.candidate.outputs.head_sha }}
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact_id }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing replacement." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing replacement." >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          foo_dj_library_bridge $VERSION

          Qualified candidate promoted without rebuilding.

          Commit: $HEAD_SHA
          Candidate workflow run: $RUN_ID
          Candidate artifact: $ARTIFACT_NAME
          Artifact ID: $ARTIFACT_ID

          The released .fb2k-component is the exact candidate artifact. Its archive layout was verified as Win32/x86 DLL in the archive root and x64 DLL under x64/.
          EOF
          gh release create "$TAG" \
            "candidate/$COMPONENT" \
            candidate/BUILD-MANIFEST.txt \
            candidate/SHA256SUMS.txt \
            --target "$HEAD_SHA" \
            --title "foo_dj_library_bridge $VERSION" \
            --notes-file release-notes.md
