name: build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: bridge-ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse new host automation scripts before Windows builds
        shell: pwsh
        run: |
          foreach ($name in @('scripts/probe-foobar-media-library-ui.ps1','scripts/qualify-live-library.ps1','scripts/verify-nonempty-host-restart.ps1','scripts/probe-external-cue.ps1','scripts/enable-cue-indexing-disposable.ps1','scripts/probe-embedded-flac-cue.ps1','scripts/local-acceptance-build.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $name).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach ($errorItem in $parseErrors) { Write-Host "POWERSHELL_PARSE_ERROR $name $($errorItem.Message)" }
            if ($parseErrors.Count -gt 0) { throw "Invalid PowerShell syntax in $name" }
            Write-Host "POWERSHELL_PARSE_$name=PASS"
          }
      - name: Independently verify lossless FLAC and embedded CUESHEET without downloaded binaries
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          python3 scripts/generate-embedded-flac-fixture.py "$fixture_dir/Synthetic Embedded.flac"
          python3 scripts/verify-embedded-flac-fixture.py "$fixture_dir/Synthetic Embedded.flac"
      - name: Static safety/contract audit
        run: python3 scripts/static_audit.py
      - name: Enforce independent source-only publication hold
        run: python3 scripts/verify-public-artifact-hold.py
      - name: Run shared portable Bridge C++ contract with GCC and all CTest regressions
        uses: lxsdd/dev-infrastructure-public/.github/actions/portable-core@d85499b0f6363821173d8c7ffc6efed5285dc4b3
        with:
          language: cmake
          source-directory: tests/portable
      - name: Build and run pure contract tests with Clang
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror tests/contract_tests.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o contract-tests-clang
          ./contract-tests-clang
      - name: Validate gzip streams independently with Python
        run: |
          python3 - <<'PY'
          import gzip
          with gzip.open('contract-test.tsv.gz','rt',encoding='utf-8') as f:
              lines=f.read().splitlines()
          assert len(lines)==4, len(lines)
          assert all(len(x.split('\t'))==26 for x in lines)
          assert lines[0].endswith('\textra_metadata_json\tmetadata_vectors_json')
          with gzip.open('large-gzip-test.gz','rb') as f:
              payload=f.read()
          expected=bytearray(b'x'*200000)
          expected[65534]=ord('A'); expected[65535]=ord('B'); expected[131069]=ord('C')
          assert payload == expected
          print('PASS: independent gzip decode, exact 26-column schema-v3 contract, multi-block boundary')
          PY

      - name: Generate 54,129 synthetic records with the original C++ Bridge writer
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror tests/interop/GenerateLargeSnapshot.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o large-producer
          ./large-producer
      - name: Generate actual C++ producer v3, legacy-v2 and large-scale verification fixtures
        run: python3 scripts/generate-snapshot-verifier-fixtures.py
      - name: Validate current v3, legacy v2, and fail-closed malformed snapshots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/verify-snapshot.ps1 -BridgeDirectory 'snapshot-verifier-fixtures/v3'
          & ./scripts/verify-snapshot.ps1 -BridgeDirectory 'snapshot-verifier-fixtures/v2'
          foreach ($name in @(
            'wrong-count', 'incomplete', 'future-schema', 'wrong-header',
            'invalid-vectors', 'nonarray-vectors', 'empty-vectors',
            'empty-path', 'invalid-subsong', 'duplicate-identity', 'negative-duration'
          )) {
            $rejected = $false
            try {
              & ./scripts/verify-snapshot.ps1 -BridgeDirectory "snapshot-verifier-fixtures/$name"
            }
            catch {
              $rejected = $true
              Write-Host "PASS: invalid synthetic snapshot '$name' rejected"
            }
            if (-not $rejected) {
              throw "Unsafe: malformed snapshot '$name' passed verification"
            }
          }
          Write-Host 'PASS: source-generated v3 and backward-compatible v2 verification, eleven negative cases'


      # Producer fixture gzip was already compiled and generated by the
      # GCC/Clang stages above. Reuse those bytes without another C++ build.
      - name: Fetch exact immutable public DJ Library reader without adding CI actions
        run: |
          mkdir -p djlib-source/src
          curl --fail --location --silent --show-error --retry 2 --output djlib-source/src/BridgeSnapshot.cs \
            https://raw.githubusercontent.com/lxsdd/dj-library-public/211e85726bcc7e63ce0f9b81f04c2e61257dc5d8/src/BridgeSnapshot.cs
          test "$(git hash-object djlib-source/src/BridgeSnapshot.cs)" = "7ec0d945e5a31443c4e38b6fe72439ad07f6dc4a"
          echo 'PASS downloaded source matches pinned original DJ Library Git blob'
          dotnet --list-sdks
          dotnet --list-sdks | awk '$1 ~ /^10[.]/ { found = 1 } END { exit !found }' || {
            echo 'Public runner lacks .NET 10 SDK; no synthetic Bridge interop verdict'
            exit 1
          }
      - name: Execute original DJ Library Bridge reader directly on C++ producer gzip fixtures
        run: |
          dotnet run --project tests/interop/BridgeProducerConsumerInterop.csproj -c Release -- ./snapshot-verifier-fixtures
          echo 'PASS original C++ producer payload interoperable with pinned unchanged DJ Library C# reader'

  windows-verifier:
    needs: contract-tests
    name: Independent PowerShell snapshot verifier (no SDK download)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify v2/v3 on native Windows PowerShell 5.1
        shell: powershell
        run: ./tests/test-verifier-windows.ps1
      - name: Verify v2/v3 on PowerShell 7
        shell: pwsh
        run: ./tests/test-verifier-windows.ps1

  windows-publisher-no-sdk:
    needs: contract-tests
    name: Native publisher without foobar SDK (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, immutable
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2, immutable
      - name: Compile actual native Publisher and replay atomic/failure/restart/54129-record tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild 'tests/publisher_integration.vcxproj' /m /p:Configuration=Release /p:Platform='${{ matrix.platform }}' /p:PlatformToolset=v143 /restore
          if ($LASTEXITCODE -ne 0) { throw 'Native standalone Publisher build failed' }
          $testRoot = Join-Path $env:RUNNER_TEMP ('bridge-sdk-free-${{ matrix.platform }}-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $testRoot) { throw 'Test directory already exists' }
          try {
            & "out/${{ matrix.platform }}/Release/publisher_integration.exe" $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Real native Publisher integration failed' }
            & ./scripts/verify-publisher-fixtures.ps1 -TestRoot $testRoot
            if (-not $?) { throw 'Native Publisher fixture verification failed' }
            & ./scripts/verify-original-bridge-consumers.ps1 -TestRoot $testRoot
            if (-not $?) { throw 'Pinned original reader interop failed' }
            Write-Host 'NATIVE_PUBLISHER_SDK_FREE_${{ matrix.platform }}=PASS'
          } finally {
            if (Test-Path -LiteralPath $testRoot) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force
            }
          }

  windows-build:
    needs: contract-tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
      - name: Checkout immutable 2026-10-01 SDK source from owner-controlled template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/sdk-template
          persist-credentials: false
      - name: Checkout immutable owner-operated foobar installer transport only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          repository: lxsdd/dev-infrastructure-public
          ref: 35369054c56f4c6ccb2f802944e9675852fd35ec
          path: external/shared-host-runner
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # pinned v2
      - name: Preflight private acceptance build tools (no source download or user files)
        shell: pwsh
        run: ./scripts/local-acceptance-build.ps1 -PreflightOnly -Toolset 'v143'
      - name: Bootstrap exact SDK and build with reviewed MSVC toolset (${{ matrix.platform }}, v143)
        shell: pwsh
        run: ./scripts/build.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset 'v143'
      - name: Verify private Bridge DLL PE machine and digest (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'Native Bridge DLL missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $dll).Path)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid MZ header' }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 64 -or $offset -ge ($bytes.Length - 26)) { throw 'Invalid PE header offset' }
          if ([Text.Encoding]::ASCII.GetString($bytes, $offset, 4) -cne ('PE' + [char]0 + [char]0)) { throw 'Invalid PE signature' }
          $actual = [BitConverter]::ToUInt16($bytes, $offset + 4)
          $expected = if ('${{ matrix.platform }}' -eq 'Win32') { [UInt16]0x014c } else { [UInt16]0x8664 }
          $magic = [BitConverter]::ToUInt16($bytes, $offset + 24)
          $expectedMagic = if ('${{ matrix.platform }}' -eq 'Win32') { [UInt16]0x010b } else { [UInt16]0x020b }
          $characteristics = [BitConverter]::ToUInt16($bytes, $offset + 22)
          if ($actual -ne $expected -or $magic -ne $expectedMagic -or ($characteristics -band 0x2000) -eq 0) { throw 'DLL PE machine or type mismatch' }
          $sha = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BRIDGE_PRIVATE_COMPONENT_PE_${{ matrix.platform }}=PASS bytes=$($bytes.Length) sha256=$sha"
      - name: Native Publisher add/edit/remove/restart snapshot integration (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild 'tests/publisher_integration.vcxproj' /m /p:Configuration=Release /p:Platform='${{ matrix.platform }}' /p:PlatformToolset='v143' /restore
          if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test build failed' }
          $testRoot = Join-Path $env:RUNNER_TEMP ('bridge-native-publisher-${{ matrix.platform }}-v143-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          try {
            & "out/${{ matrix.platform }}/Release/publisher_integration.exe" $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test failed' }
            & ./scripts/verify-publisher-fixtures.ps1 -TestRoot $testRoot
            & ./scripts/verify-original-bridge-consumers.ps1 -TestRoot $testRoot
            if (-not $?) { throw 'Original consumers did not accept native Publisher snapshots' }
          } finally {
            if (Test-Path -LiteralPath $testRoot) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force
            }
          }
      - name: Real foobar2000 host, Media Library and CUE smoke (${{ matrix.platform }})
        shell: pwsh
        run: |
          ./scripts/verify-bridge-host-with-pinned-installer.ps1 `
            -Architecture '${{ matrix.platform }}' `
            -ComponentDll 'out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll' `
            -ProfileCheckScript 'scripts/probe-foobar-media-library-ui.ps1' `
            -RestartProfileCheck 'true'
      - name: Isolated exact-source private Win32+x64 candidate build (x64 CI runner only)
        if: github.event_name == 'pull_request' && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.event.pull_request.head.sha }}'
          if ($sourceSha -cnotmatch '^[a-f0-9]{40}$') { throw 'Unpinned candidate SHA' }
          $root = Join-Path $env:RUNNER_TEMP ('bridge-local-sha-proof-v143-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Private candidate temp root unexpectedly exists' }
          try {
            ./scripts/local-acceptance-build.ps1 -SourceSha $sourceSha -OutputDirectory $root -Toolset 'v143'
            Write-Host "BRIDGE_PRIVATE_ACCEPTANCE_GIT_SHA_BUILD=PASS sha=$sourceSha toolset=v143"
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop }
          }
      - name: Upload DLL
        if: false # Private source-only qualification, never upload DLLs
        uses: actions/upload-artifact@v7
        with:
          name: foo_dj_library_bridge-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll
          if-no-files-found: error
          retention-days: 7

  windows-build-v145:
    needs: contract-tests
    name: Windows foobar host (${{ matrix.platform }}, v145)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
      - name: Checkout immutable 2026-10-01 SDK source from owner-controlled template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/sdk-template
          persist-credentials: false
      - name: Checkout immutable owner-operated foobar installer transport only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          repository: lxsdd/dev-infrastructure-public
          ref: 35369054c56f4c6ccb2f802944e9675852fd35ec
          path: external/shared-host-runner
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # pinned v2
      - name: Preflight private acceptance build tools (no source download or user files)
        shell: pwsh
        run: ./scripts/local-acceptance-build.ps1 -PreflightOnly -Toolset 'v145'
      - name: Bootstrap exact SDK and build with reviewed MSVC toolset (${{ matrix.platform }}, v145)
        shell: pwsh
        run: ./scripts/build.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset 'v145'
      - name: Verify private Bridge DLL PE machine and digest (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll'
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw 'Native Bridge DLL missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $dll).Path)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid MZ header' }
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($offset -lt 64 -or $offset -ge ($bytes.Length - 26)) { throw 'Invalid PE header offset' }
          if ([Text.Encoding]::ASCII.GetString($bytes, $offset, 4) -cne ('PE' + [char]0 + [char]0)) { throw 'Invalid PE signature' }
          $actual = [BitConverter]::ToUInt16($bytes, $offset + 4)
          $expected = if ('${{ matrix.platform }}' -eq 'Win32') { [UInt16]0x014c } else { [UInt16]0x8664 }
          $magic = [BitConverter]::ToUInt16($bytes, $offset + 24)
          $expectedMagic = if ('${{ matrix.platform }}' -eq 'Win32') { [UInt16]0x010b } else { [UInt16]0x020b }
          $characteristics = [BitConverter]::ToUInt16($bytes, $offset + 22)
          if ($actual -ne $expected -or $magic -ne $expectedMagic -or ($characteristics -band 0x2000) -eq 0) { throw 'DLL PE machine or type mismatch' }
          $sha = (Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BRIDGE_PRIVATE_COMPONENT_PE_${{ matrix.platform }}=PASS bytes=$($bytes.Length) sha256=$sha"
      - name: Native Publisher add/edit/remove/restart snapshot integration (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild 'tests/publisher_integration.vcxproj' /m /p:Configuration=Release /p:Platform='${{ matrix.platform }}' /p:PlatformToolset='v145' /restore
          if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test build failed' }
          $testRoot = Join-Path $env:RUNNER_TEMP ('bridge-native-publisher-${{ matrix.platform }}-v145-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          try {
            & "out/${{ matrix.platform }}/Release/publisher_integration.exe" $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test failed' }
            & ./scripts/verify-publisher-fixtures.ps1 -TestRoot $testRoot
            & ./scripts/verify-original-bridge-consumers.ps1 -TestRoot $testRoot
            if (-not $?) { throw 'Original consumers did not accept native Publisher snapshots' }
          } finally {
            if (Test-Path -LiteralPath $testRoot) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force
            }
          }
      - name: Real foobar2000 host, Media Library and CUE smoke (${{ matrix.platform }})
        shell: pwsh
        run: |
          ./scripts/verify-bridge-host-with-pinned-installer.ps1 `
            -Architecture '${{ matrix.platform }}' `
            -ComponentDll 'out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll' `
            -ProfileCheckScript 'scripts/probe-foobar-media-library-ui.ps1' `
            -RestartProfileCheck 'true'
      - name: Isolated exact-source private Win32+x64 candidate build (x64 CI runner only)
        if: github.event_name == 'pull_request' && matrix.platform == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '${{ github.event.pull_request.head.sha }}'
          if ($sourceSha -cnotmatch '^[a-f0-9]{40}$') { throw 'Unpinned candidate SHA' }
          $root = Join-Path $env:RUNNER_TEMP ('bridge-local-sha-proof-v145-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Private candidate temp root unexpectedly exists' }
          try {
            ./scripts/local-acceptance-build.ps1 -SourceSha $sourceSha -OutputDirectory $root -Toolset 'v145'
            Write-Host "BRIDGE_PRIVATE_ACCEPTANCE_GIT_SHA_BUILD=PASS sha=$sourceSha toolset=v145"
          } finally {
            if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop }
          }
  package-component:
    name: Package verified foobar2000 component
    if: false # No combined component packaging without owner rights clearance
    needs:
      - contract-tests
      - windows-verifier
      - windows-publisher-no-sdk
      - windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Win32 DLL
        uses: actions/download-artifact@v8
        with:
          name: foo_dj_library_bridge-Win32
          path: candidate-input/Win32
      - name: Download x64 DLL
        uses: actions/download-artifact@v8
        with:
          name: foo_dj_library_bridge-x64
          path: candidate-input/x64
      - name: Verify architectures and build .fb2k-component
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          ./scripts/package-component.ps1 `
            -Win32Dll 'candidate-input/Win32/foo_dj_library_bridge.dll' `
            -X64Dll 'candidate-input/x64/foo_dj_library_bridge.dll' `
            -OutputDirectory 'candidate-output' `
            -Version $version `
            -Commit '${{ github.sha }}'
      - name: Upload qualified component candidate
        if: false # Explicit second-line no-public-binaries gate; package job also disabled
        uses: actions/upload-artifact@v7
        with:
          name: foo_dj_library_bridge-component-${{ github.sha }}
          path: |
            candidate-output/*.fb2k-component
            candidate-output/BUILD-MANIFEST.txt
            candidate-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
