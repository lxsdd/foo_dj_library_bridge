name: build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: bridge-ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse new host automation scripts before Windows builds
        shell: pwsh
        run: |
          foreach ($name in @('scripts/probe-foobar-media-library-ui.ps1','scripts/qualify-live-library.ps1','scripts/verify-nonempty-host-restart.ps1','scripts/probe-external-cue.ps1','scripts/enable-cue-indexing-disposable.ps1','scripts/probe-embedded-flac-cue.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $name).Path,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach ($errorItem in $parseErrors) { Write-Host "POWERSHELL_PARSE_ERROR $name $($errorItem.Message)" }
            if ($parseErrors.Count -gt 0) { throw "Invalid PowerShell syntax in $name" }
            Write-Host "POWERSHELL_PARSE_$name=PASS"
          }
      - name: Independently decode the source-generated embedded FLAC fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          python3 scripts/generate-embedded-flac-fixture.py "$fixture_dir/Synthetic Embedded.flac"
          ffmpeg -nostdin -v error -xerror -i "$fixture_dir/Synthetic Embedded.flac" -f null -
          ffprobe -v error -show_entries format_tags=CUESHEET -of json "$fixture_dir/Synthetic Embedded.flac" > "$fixture_dir/tags.json"
          python3 - "$fixture_dir/tags.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          cue=data['format']['tags']['CUESHEET']
          assert 'TRACK 01 AUDIO' in cue and 'TRACK 02 AUDIO' in cue
          assert 'Embedded Alpha' in cue and 'Embedded Beta' in cue
          print('FLAC_EMBEDDED_INDEPENDENT_DECODE_AND_VORBIS_CUE=PASS')
          PY
      - name: Static safety/contract audit
        run: python3 scripts/static_audit.py
      - name: Build pure contract tests with GCC
        run: g++ -std=c++20 -Wall -Wextra -Werror tests/contract_tests.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o contract-tests
      - name: Run GCC contract tests
        run: ./contract-tests
      - name: Build and run pure contract tests with Clang
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror tests/contract_tests.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o contract-tests-clang
          ./contract-tests-clang
      - name: Validate gzip streams independently with Python
        run: |
          python3 - <<'PY'
          import gzip
          with gzip.open('contract-test.tsv.gz','rt',encoding='utf-8') as f:
              lines=f.read().splitlines()
          assert len(lines)==4, len(lines)
          assert all(len(x.split('\t'))==26 for x in lines)
          assert lines[0].endswith('\textra_metadata_json\tmetadata_vectors_json')
          with gzip.open('large-gzip-test.gz','rb') as f:
              payload=f.read()
          expected=bytearray(b'x'*200000)
          expected[65534]=ord('A'); expected[65535]=ord('B'); expected[131069]=ord('C')
          assert payload == expected
          print('PASS: independent gzip decode, exact 26-column schema-v3 contract, multi-block boundary')
          PY

  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - name: Bootstrap exact foobar2000 SDK and build with VS2022 toolset
        shell: pwsh
        run: ./scripts/build.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset v143
      - name: Native Publisher add/edit/remove/restart snapshot integration (${{ matrix.platform }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild 'tests/publisher_integration.vcxproj' /m /p:Configuration=Release /p:Platform='${{ matrix.platform }}' /p:PlatformToolset=v143 /restore
          if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test build failed' }
          $testRoot = Join-Path $env:RUNNER_TEMP ('bridge-native-publisher-${{ matrix.platform }}-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          try {
            & "out/${{ matrix.platform }}/Release/publisher_integration.exe" $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Native Publisher test failed' }
            & ./scripts/verify-publisher-fixtures.ps1 -TestRoot $testRoot
            # Use the exact original DJ Library reader, not a test-only replacement.
            $readerCommit = '211e85726bcc7e63ce0f9b81f04c2e61257dc5d8'
            $readerBlob = '7ec0d945e5a31443c4e38b6fe72439ad07f6dc4a'
            $readerFile = Join-Path $testRoot 'OriginalBridgeSnapshot.cs'
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/lxsdd/dj-library-public/$readerCommit/src/BridgeSnapshot.cs" -OutFile $readerFile -ErrorAction Stop
            $actualBlob = (& git hash-object -- $readerFile).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -cne $readerBlob) {
              throw "Original DJ Library reader SHA mismatch: $actualBlob"
            }
            $consumerOut = Join-Path $testRoot 'native-consumer'
            & dotnet build 'tests/native-consumer/BridgeNativeWindowsConsumer.csproj' -c Release "-p:ExternalBridgeSource=$readerFile" -o $consumerOut --nologo
            if ($LASTEXITCODE -ne 0) { throw 'Original DJ Library reader compilation failed' }
            & dotnet (Join-Path $consumerOut 'BridgeNativeWindowsConsumer.dll') $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Actual native Publisher to original DJ Library C# consumer validation failed' }
            # Read the same actual native Publisher bytes with the production
            # MyTagSync Bridge readers. Pin both original source files by Git blob.
            $mytagCommit = 'f891f9cde526601e6d6ce098c20b7c8b65136193'
            $mytagFiles = @(
              @{ Relative = 'BridgeSnapshot.cs'; Sha = '7f3774cdf68d42ccc0050f971e30b8bfd4aab407'; Property = 'MyTagBridgeSource' },
              @{ Relative = 'BridgeSourceDiscovery.cs'; Sha = '8ba87ffbba0dc2a50a0d9b7cf4030c9361c19264'; Property = 'MyTagDiscoverySource' }
            )
            $mytagSource = @{}
            foreach ($source in $mytagFiles) {
              $sourcePath = Join-Path $testRoot ('original-mytag-' + $source.Relative)
              $uri = "https://raw.githubusercontent.com/lxsdd/rekordbox-mytag-sync/$mytagCommit/src/RekordboxMyTagSync/Core/$($source.Relative)"
              Invoke-WebRequest -Uri $uri -OutFile $sourcePath -ErrorAction Stop
              $actualGitBlob = (& git hash-object -- $sourcePath).Trim()
              if ($LASTEXITCODE -ne 0 -or $actualGitBlob -cne $source.Sha) {
                throw "Original MyTagSync $($source.Relative) source hash mismatch"
              }
              $mytagSource[$source.Property] = $sourcePath
            }
            $mytagOut = Join-Path $testRoot 'original-mytag-consumer'
            & dotnet build 'tests/mytag-consumer/OriginalMyTagBridgeInterop.csproj' -c Release "-p:MyTagBridgeSource=$($mytagSource.MyTagBridgeSource)" "-p:MyTagDiscoverySource=$($mytagSource.MyTagDiscoverySource)" -o $mytagOut --nologo
            if ($LASTEXITCODE -ne 0) { throw 'Original MyTagSync Bridge source compilation failed' }
            & dotnet (Join-Path $mytagOut 'OriginalMyTagBridgeInterop.dll') $testRoot
            if ($LASTEXITCODE -ne 0) { throw 'Native Bridge Publisher to original MyTagSync Bridge consumer failed' }
          } finally {
            if (Test-Path -LiteralPath $testRoot) {
              Remove-Item -LiteralPath $testRoot -Recurse -Force
            }
          }
      - name: Real foobar2000 host/component smoke (${{ matrix.platform }})
        uses: lxsdd/dev-infrastructure-public/.github/actions/foobar-host-smoke@6a9829ff7ba689d2ab3a1291db1734ad29d577c6
        with:
          architecture: ${{ matrix.platform }}
          component-dll: out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll
          profile-check-script: scripts/probe-foobar-media-library-ui.ps1
          restart-profile-check: 'true'
      - name: Upload DLL
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: foo_dj_library_bridge-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll
          if-no-files-found: error
          retention-days: 7

  package-component:
    name: Package verified foobar2000 component
    if: github.event_name != 'pull_request'
    needs:
      - contract-tests
      - windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Win32 DLL
        uses: actions/download-artifact@v8
        with:
          name: foo_dj_library_bridge-Win32
          path: candidate-input/Win32
      - name: Download x64 DLL
        uses: actions/download-artifact@v8
        with:
          name: foo_dj_library_bridge-x64
          path: candidate-input/x64
      - name: Verify architectures and build .fb2k-component
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          ./scripts/package-component.ps1 `
            -Win32Dll 'candidate-input/Win32/foo_dj_library_bridge.dll' `
            -X64Dll 'candidate-input/x64/foo_dj_library_bridge.dll' `
            -OutputDirectory 'candidate-output' `
            -Version $version `
            -Commit '${{ github.sha }}'
      - name: Upload qualified component candidate
        uses: actions/upload-artifact@v7
        with:
          name: foo_dj_library_bridge-component-${{ github.sha }}
          path: |
            candidate-output/*.fb2k-component
            candidate-output/BUILD-MANIFEST.txt
            candidate-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
