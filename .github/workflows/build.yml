name: build
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'AGENTS.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: bridge-ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Static safety/contract audit
        run: python3 scripts/static_audit.py
      - name: Enforce public artifact and release licensing hold
        run: python3 scripts/verify-public-artifact-hold.py
      - name: Build pure contract tests with GCC
        run: g++ -std=c++20 -Wall -Wextra -Werror tests/contract_tests.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o contract-tests
      - name: Run GCC contract tests
        run: ./contract-tests
      - name: Build and run pure contract tests with Clang
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror tests/contract_tests.cpp src/bridge_contract.cpp src/gzip_stored.cpp -o contract-tests-clang
          ./contract-tests-clang
      - name: Validate gzip streams independently with Python
        run: |
          python3 - <<'PY'
          import gzip
          with gzip.open('contract-test.tsv.gz','rt',encoding='utf-8') as f:
              lines=f.read().splitlines()
          assert len(lines)==4, len(lines)
          assert all(len(x.split('\t'))==26 for x in lines)
          assert lines[0].endswith('\textra_metadata_json\tmetadata_vectors_json')
          with gzip.open('large-gzip-test.gz','rb') as f:
              payload=f.read()
          expected=bytearray(b'x'*200000)
          expected[65534]=ord('A'); expected[65535]=ord('B'); expected[131069]=ord('C')
          assert payload == expected
          print('PASS: independent gzip decode, exact 26-column schema-v3 contract, multi-block boundary')
          PY

  windows-source-only-preflight:
    name: Private build prerequisites (no vendor downloads)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Verify Win32/x64 MSVC toolchain and 7-Zip without downloading the SDK
        shell: pwsh
        run: ./scripts/local-acceptance-build.ps1 -PreflightOnly

  windows-build:
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [Win32, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
      - name: Bootstrap exact foobar2000 SDK and build with VS2022 toolset
        shell: pwsh
        run: ./scripts/build.ps1 -Platform '${{ matrix.platform }}' -Configuration Release -PlatformToolset v143
      - name: Verify local private Windows acceptance prerequisites
        shell: pwsh
        run: ./scripts/local-acceptance-build.ps1 -PreflightOnly
      - name: Verify standalone Bridge helper downloaded to Windows Temp
        if: matrix.platform == 'x64' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXACT_SHA.Length -ne 40 -or $env:EXACT_SHA -notmatch '^[a-f0-9]+$') { throw 'Non-SHA PR HEAD' }
          $helper = Join-Path $env:RUNNER_TEMP 'foo_dj_library_bridge-standalone.ps1'
          $url = 'https://raw.githubusercontent.com/lxsdd/foo_dj_library_bridge/' + $env:EXACT_SHA + '/scripts/local-acceptance-build.ps1'
          Invoke-WebRequest -UseBasicParsing -MaximumRedirection 5 -Uri $url -OutFile $helper
          Push-Location $env:RUNNER_TEMP
          try {
            & $helper -PreflightOnly
            if (-not $?) { throw 'Standalone helper preflight failed' }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $helper -Force -ErrorAction SilentlyContinue
          }
      - name: Record official SDK archive SHA-256 for offline pin verification
        shell: pwsh
        run: |
          $sdk = 'external/SDK-2026-09-17.7z'
          if (-not (Test-Path -LiteralPath $sdk -PathType Leaf)) { throw 'SDK archive missing from original bootstrap' }
          $size = (Get-Item -LiteralPath $sdk).Length
          $hash = (Get-FileHash -LiteralPath $sdk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "OFFICIAL_FOOBAR_SDK_2026_09_17_SIZE=$size"
          Write-Host "OFFICIAL_FOOBAR_SDK_2026_09_17_SHA256=$hash"
      - name: Exercise SHA-pinned local dual-architecture candidate without uploading
        if: false # Full local source-to-package qualification PASS (GitHub run 39435835240); avoid repeated expensive builds
        shell: pwsh
        run: ./scripts/local-acceptance-build.ps1 -SourceSha '${{ github.event.pull_request.head.sha }}' -OutputDirectory "$env:RUNNER_TEMP\Bridge-private-acceptance"

      - name: Upload DLL
        if: false # Temporary rights gate: build and test only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (disabled)
        with:
          name: foo_dj_library_bridge-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/Release/foo_dj_library_bridge.dll
          if-no-files-found: error
          retention-days: 7

  package-component:
    name: Package verified foobar2000 component
    if: false # Component package publication disabled
    needs:
      - contract-tests
      - windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download Win32 DLL
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (disabled)
        with:
          name: foo_dj_library_bridge-Win32
          path: candidate-input/Win32
      - name: Download x64 DLL
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8 (disabled)
        with:
          name: foo_dj_library_bridge-x64
          path: candidate-input/x64
      - name: Verify architectures and build .fb2k-component
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath VERSION).Trim()
          ./scripts/package-component.ps1 `
            -Win32Dll 'candidate-input/Win32/foo_dj_library_bridge.dll' `
            -X64Dll 'candidate-input/x64/foo_dj_library_bridge.dll' `
            -OutputDirectory 'candidate-output' `
            -Version $version `
            -Commit '${{ github.sha }}'
      - name: Upload qualified component candidate
        if: false # Explicit second-line artifact block
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (disabled)
        with:
          name: foo_dj_library_bridge-component-${{ github.sha }}
          path: |
            candidate-output/*.fb2k-component
            candidate-output/BUILD-MANIFEST.txt
            candidate-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
